name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container:
      image: debian:trixie-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, arch: x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, arch: aarch64 }
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Derive and verify version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '\"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "$version" ]]; then
            printf 'Cargo.toml has no package version.\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            printf 'Tag %s does not match Cargo.toml version %s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist/bundle
          install -Dm755 "target/${TARGET}/release/rudo" dist/bundle/rudo
          install -Dm644 README.md dist/bundle/README.md
          install -Dm644 LICENSE dist/bundle/LICENSE
          install -Dm644 docs/rudo.service dist/bundle/rudo.service
          tar -C dist/bundle -czf "dist/rudo-${VERSION}-${ARCH}-linux.tar.gz" \
            rudo README.md LICENSE rudo.service

      - uses: actions/upload-artifact@v4
        with:
          name: rudo-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  check:
    name: Code Quality
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  release:
    name: Release
    needs: [build, test, check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rudo-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            docs/rudo.service
          fail_on_unmatched_files: true
          generate_release_notes: true

  aur-publish:
    name: Publish to AUR
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git curl openssh sudo

      - uses: actions/checkout@v4

      - name: Prepare AUR package and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aur-dist
          cp .github/PKGBUILD .github/rudo-bin.install aur-dist/
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur-dist/PKGBUILD
          sed -i "s|^url=.*|url='https://github.com/${GITHUB_REPOSITORY}'|" aur-dist/PKGBUILD
          for arch in x86_64 aarch64; do
            archive="rudo-${VERSION}-${arch}-linux.tar.gz"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${archive}" \
              --output "$archive"
            checksum="$(sha256sum "$archive")"
            checksum="${checksum%% *}"
            sed -i "s/^sha256sums_${arch}=.*/sha256sums_${arch}=('${checksum}')/" aur-dist/PKGBUILD
          done

      - name: Generate .SRCINFO as builder user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers
          chown -R builder:builder aur-dist
          sudo -u builder bash -lc 'cd aur-dist && makepkg --printsrcinfo > .SRCINFO'

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: rudo-bin
          pkgbuild: ./aur-dist/PKGBUILD
          assets: |
            aur-dist/.SRCINFO
            aur-dist/rudo-bin.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update rudo-bin to ${{ needs.build.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
